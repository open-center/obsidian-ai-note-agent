name: Build and lint

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
            - run: npm run build
            - run: npm run lint
